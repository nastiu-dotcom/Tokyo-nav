# Runs the app's automatic checks on every push and pull request, so a broken
# change is caught on GitHub before it reaches the phones. Free for this repo.
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 scripts/trip2027/build.py > /dev/null && git diff --exit-code data/tokyo-5day-2027.json
